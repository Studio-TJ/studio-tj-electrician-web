<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.url == '/' %}
      <title>{{ site.title }}</title>
    {% else %}
      <title>{{ page.title }} · {{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#0b0e0a">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/images/og.png' | absolute_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="TJ Electro home">
          <span class="brand-mark" aria-hidden="true">⚡</span>
          <span class="brand-copy">
            <strong>TJ ELECTRO</strong>
            <small>Residential electrician</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active" aria-current="page"{% endif %}>Company</a>
          <a href="{{ '/portfolio/' | relative_url }}"{% if page.url == '/portfolio/' %} class="is-active" aria-current="page"{% endif %}>Portfolio</a>
          <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} class="is-active" aria-current="page"{% endif %}>Contact</a>
        </nav>
      </header>

      <main id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div>
          <strong>TJ Electro</strong>
          <span>Residential electrical services in Almere.</span>
        </div>
        <div class="footer-meta">
          <span>TJ Electro · KvK 80477917</span>
          <span>© 2026 TJ Electro</span>
        </div>
      </footer>
    </div>
  </body>
</html>
